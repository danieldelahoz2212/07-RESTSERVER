<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body class="container">

  <div class="row mt-5">
    <div class="col-sm-6">
      <h1>Google Sign-In</h1>
      <hr>
      <br>
      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
        data-text="sign_in_with" data-logo_alignment="left" data-size="large"></div>
      <br>
      <button id="google_signout">Sign Out</button>
    </div>
    <div class="col-sm-6">
      <h1>Login Manual</h1>
      <hr>
    <form class="d-grid gap-2">
      <input type="text" name="email" class="form-control" placeholder="Email">
      <input type="password" name="password" class="form-control" placeholder="Password">
      <button type="submit" class="btn btn-primary">
        Sign In
      </button>
    </form>
    </div>
  </div>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <div id="g_id_onload" data-client_id="911719461602-4tq4eo9jtpdd5a6l53chjalaq5169gpd.apps.googleusercontent.com"
    data-callback="handleCredentialResponse" data-auto_prompt="false"></div>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="./js/auth.js"></script>
</body>

</html>
